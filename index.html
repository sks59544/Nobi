<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10121a"><meta name="description" content="Nobi - your AI assistant">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg">
<title>Nobi AI</title>
<style>
:root{color-scheme:dark;--bg:#10121a;--panel:#171a25;--panel2:#202433;--line:#2b3042;--text:#f5f6fb;--muted:#a8afc3;--accent:#9d8cff;--accent2:#72d9d0;--danger:#ff8f9c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:10px 13px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:not-allowed}input,textarea{background:#11141d;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}input:focus,textarea:focus{border-color:var(--accent)}.hidden{display:none!important}.layout{display:grid;grid-template-columns:260px 1fr;min-height:100dvh}.side{background:#131620;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#111;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.grow{flex:1}.history{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:45vh}.history button{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:transparent}.history button.active{background:var(--panel2)}.main{display:flex;flex-direction:column;min-width:0;height:100dvh}.top{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.topright{display:flex;gap:8px;align-items:center}.messages{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 820px)/2));display:flex;flex-direction:column;gap:18px}.welcome{margin:auto;max-width:620px;text-align:center}.welcome h1{font-size:clamp(32px,5vw,48px);margin:10px 0}.orb{margin:auto;width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 70px #9d8cff38;display:grid;place-items:center;color:#10121a;font-size:30px;font-weight:900}.bubble{max-width:820px;width:100%;align-self:center;display:flex;gap:12px}.bubble.user{justify-content:flex-end}.bubble .content{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);padding:13px 16px;border-radius:16px;max-width:90%}.bubble.user .content{background:#2b2844}.avatar{flex:0 0 30px;width:30px;height:30px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:700}.composerwrap{padding:12px 18px 20px;border-top:1px solid var(--line)}.composer{max-width:820px;margin:auto}.tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.compose-row{display:flex;gap:8px;align-items:flex-end}.compose-row textarea{resize:none;min-height:48px;max-height:150px}.primary{background:var(--accent);color:#11121a;border-color:transparent;font-weight:700}.accent{color:var(--accent2)}.notice{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:5}.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow:auto}.modal h2{margin:0}.tabs{display:flex;gap:8px}.tabs button{flex:1}.error{color:var(--danger);font-size:13px;min-height:18px}.result a{color:var(--accent2);overflow-wrap:anywhere}.result{border-bottom:1px solid var(--line);padding:12px 0}.adminstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--panel2);padding:12px;border-radius:12px}.stat strong{font-size:23px;display:block}.userrow{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.mobilemenu{display:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:none;position:fixed;z-index:4;inset:0 auto 0 0;width:min(300px,85vw);box-shadow:0 0 0 999px #0008}.side.open{display:flex}.mobilemenu{display:inline-block}.main{height:100dvh}.top{padding:10px 12px}.messages{padding:18px 12px}.composerwrap{padding:10px 10px max(12px,env(safe-area-inset-bottom))}.topright .email{display:none}.tools button{padding:8px 10px}.adminstats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="layout">
<aside class="side" id="sidebar">
  <div class="brand"><div class="logo">N</div><span>Nobi</span></div>
  <button class="primary" id="newChat">＋ New chat</button>
  <div class="muted small">YOUR CHATS</div><div id="history" class="history"></div>
  <div class="grow"></div>
  <button id="imageBtn">▧ Generate image</button>
  <button id="searchBtn">⌕ Search the web</button>
  <button id="adminBtn" class="hidden">⚙ Admin panel</button>
  <div id="accountArea" class="muted small">Sign in to save chats.</div>
  <button id="accountBtn">Sign in / Create account</button>
</aside>
<main class="main">
<header class="top"><div style="display:flex;gap:8px;align-items:center"><button class="mobilemenu" id="menuBtn">☰</button><strong>Nobi <span class="muted">AI</span></strong></div><div class="topright"><span id="topUser" class="muted small email"></span><button id="topAccount">Sign in</button></div></header>
<section class="messages" id="messages"><div class="welcome" id="welcome"><div class="orb">N</div><h1>Hi, I'm Nobi.</h1><p class="muted">Your AI assistant for ideas, learning, writing, and more.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px"><button class="suggest" data-prompt="Explain something difficult in simple words">Explain something</button><button class="suggest" data-prompt="Help me brainstorm creative ideas">Brainstorm ideas</button><button class="suggest" data-prompt="Help me write a clear message">Write something</button></div></div></section>
<div class="composerwrap"><div class="composer"><div class="tools"><button id="micBtn" title="Voice input">🎙 Voice</button><button id="speakBtn" title="Read last answer aloud">🔊 Read answer</button><span id="status" class="muted small"></span></div><div class="compose-row"><textarea id="prompt" rows="1" placeholder="Message Nobi… (Enter to send)"></textarea><button id="sendBtn" class="primary">Send ↑</button></div><div class="notice">Nobi can make mistakes. Check important information.</div></div></div>
</main></div>
<div id="modalRoot"></div>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('nobi_token')||'', user=null, currentConversation=null, lastAnswer='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){if(location.protocol==='file:'||location.protocol==='content:')throw new Error('Nobi server is not connected. You opened this HTML file locally (content://). Account creation/login only works after Nobi is hosted or its Node.js server is running. Open the hosted HTTPS Nobi URL, then try again.');let r;try{r=await fetch('/api'+path,{...opts,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...(opts.headers||{})}})}catch(e){throw new Error('Cannot reach the Nobi server. Start/deploy the Node.js server and open Nobi from its website URL (not from a downloaded HTML file).')}let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'Request failed');return data}
function modal(html){$('modalRoot').innerHTML='<div class="modalback" id="modalback"><div class="modal">'+html+'</div></div>'; $('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()})}
function closeModal(){$('modalRoot').innerHTML=''}
function setStatus(s){$('status').textContent=s||''}
function addBubble(role,content){$('welcome')?.remove();const div=document.createElement('div');div.className='bubble '+(role==='user'?'user':'assistant');div.innerHTML=(role==='user'?'':'<div class="avatar">N</div>')+'<div class="content">'+esc(content)+'</div>'+(role==='user'?'':'');$('messages').append(div);$('messages').scrollTop=$('messages').scrollHeight;return div}
function showWelcome(){ $('messages').innerHTML='<div class="welcome" id="welcome"><div class="orb">N</div><h1>Hi, I’m Nobi.</h1><p class="muted">Your AI assistant for ideas, learning, writing, and more.</p></div>'; }
async function refreshHistory(){if(!token){$('history').innerHTML='<div class="muted small">Sign in to save and revisit chats.</div>';return}try{const d=await api('/conversations');$('history').innerHTML=d.conversations.map(c=>`<button data-id="${esc(c.id)}" class="${c.id===currentConversation?'active':''}">${esc(c.title)}</button>`).join('')||'<div class="muted small">No chats yet.</div>';document.querySelectorAll('#history button[data-id]').forEach(b=>b.onclick=()=>loadConversation(b.dataset.id))}catch(e){$('history').innerHTML='<div class="muted small">Could not load chats.</div>'}}
function updateAccount(){const signed=!!user;$('accountArea').textContent=signed?`${user.name} · ${user.email}`:'Chats are saved to your account.';$('accountBtn').textContent=signed?'Sign out':'Sign in / Create account';$('topAccount').textContent=signed?'Account':'Sign in';$('topUser').textContent=signed?user.name:'';$('adminBtn').classList.toggle('hidden',user?.role!=='admin')}
async function loadMe(){if(!token){user=null;updateAccount();refreshHistory();return}try{user=(await api('/me')).user}catch{token='';localStorage.removeItem('nobi_token');user=null}updateAccount();refreshHistory()}
function showAuth(){modal(`<h2>Welcome to Nobi</h2><p class="muted">Create an account to save your chats across sessions.</p><div class="tabs"><button id="loginTab" class="primary">Sign in</button><button id="registerTab">Create account</button></div><form id="authForm"><div id="nameField" class="hidden"><label class="small">Name</label><input id="authName" autocomplete="name" placeholder="Your name"></div><label class="small">Email</label><input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"><label class="small">Password</label><input id="authPassword" type="password" autocomplete="current-password" required minlength="10" placeholder="At least 10 characters"><div class="error" id="authError"></div><button class="primary" style="width:100%" type="submit">Sign in</button></form><button id="cancelAuth">Cancel</button>`);let mode='login';const setMode=m=>{mode=m;$('nameField').classList.toggle('hidden',m!=='register');$('loginTab').classList.toggle('primary',m==='login');$('registerTab').classList.toggle('primary',m==='register');$('authForm').querySelector('button[type=submit]').textContent=m==='login'?'Sign in':'Create account';$('authPassword').autocomplete=m==='login'?'current-password':'new-password'};$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('cancelAuth').onclick=closeModal;$('authForm').onsubmit=async e=>{e.preventDefault();$('authError').textContent='';try{const d=await api('/auth/'+mode,{method:'POST',body:JSON.stringify({name:$('authName').value,email:$('authEmail').value,password:$('authPassword').value})});token=d.token;localStorage.setItem('nobi_token',token);user=d.user;closeModal();updateAccount();refreshHistory()}catch(err){$('authError').textContent=err.message}}}
async function newChat(){currentConversation=null;showWelcome();await refreshHistory();$('prompt').focus()}
async function loadConversation(id){try{const d=await api('/conversations/'+id);currentConversation=id;$('messages').innerHTML='';if(!d.messages.length)showWelcome();d.messages.forEach(m=>addBubble(m.role,m.content));refreshHistory();$('sidebar').classList.remove('open')}catch(e){setStatus(e.message)}}
async function sendMessage(text){text=(text??$('prompt').value).trim();if(!text)return;if(!token){showAuth();return} $('prompt').value='';$('prompt').style.height='auto';addBubble('user',text);const thinking=addBubble('assistant','Thinking…');$('sendBtn').disabled=true;setStatus('Thinking…');try{const d=await api('/chat',{method:'POST',body:JSON.stringify({conversationId:currentConversation,message:text})});currentConversation=d.conversationId;thinking.querySelector('.content').textContent=d.answer;lastAnswer=d.answer;refreshHistory()}catch(e){thinking.querySelector('.content').textContent=e.message}finally{$('sendBtn').disabled=false;setStatus('');$('messages').scrollTop=$('messages').scrollHeight}}
$('sendBtn').onclick=()=>sendMessage();$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('prompt').addEventListener('input',()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,150)+'px'});$('newChat').onclick=newChat;
$('accountBtn').onclick=()=>{if(user){token='';localStorage.removeItem('nobi_token');user=null;currentConversation=null;updateAccount();showWelcome();refreshHistory()}else showAuth()};$('topAccount').onclick=()=>user?modal(`<h2>Account</h2><p>${esc(user.name)}<br><span class="muted">${esc(user.email)}</span></p><button id="signoutModal">Sign out</button><button id="closeAccount">Close</button>`):showAuth();
$('modalRoot').addEventListener('click',e=>{if(e.target.id==='signoutModal'){$('accountBtn').click();closeModal()}if(e.target.id==='closeAccount')closeModal()});
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');document.querySelectorAll('.suggest').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.prompt;$('prompt').focus()});
$('micBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus('Voice input is not supported in this browser. Try Chrome.');return}const rec=new SR();rec.lang=navigator.language||'en-IN';rec.interimResults=false;setStatus('Listening…');rec.onresult=e=>{$('prompt').value=e.results[0][0].transcript;setStatus('Voice captured.')};rec.onerror=()=>setStatus('Microphone error. Check browser permission.');rec.onend=()=>{};rec.start()};
$('speakBtn').onclick=()=>{if(!lastAnswer){setStatus('No answer to read yet.');return}if(!('speechSynthesis'in window)){setStatus('Speech output is not supported.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastAnswer);u.lang=navigator.language||'en-IN';speechSynthesis.speak(u)};
$('imageBtn').onclick=()=>{if(!token){showAuth();return}modal(`<h2>Generate an image</h2><p class="muted">Describe what you want Nobi to create.</p><textarea id="imagePrompt" rows="4" placeholder="A cinematic view of a futuristic city at sunrise…"></textarea><div class="error" id="imageError"></div><button class="primary" id="makeImage">Generate image</button><button id="closeImage">Cancel</button><div id="imageResult"></div>`);$('closeImage').onclick=closeModal;$('makeImage').onclick=async()=>{const b=$('makeImage');b.disabled=true;b.textContent='Generating…';$('imageError').textContent='';try{const d=await api('/image',{method:'POST',body:JSON.stringify({prompt:$('imagePrompt').value})});$('imageResult').innerHTML=d.url?`<img alt="Generated image" style="width:100%;border-radius:12px" src="${esc(d.url)}">`:`<img alt="Generated image" style="width:100%;border-radius:12px" src="${d.dataUrl}">`}catch(e){$('imageError').textContent=e.message}finally{b.disabled=false;b.textContent='Generate image'}}};
$('searchBtn').onclick=()=>{if(!token){showAuth();return}modal(`<h2>Search the web</h2><input id="searchQuery" placeholder="What do you want to find?"><div class="error" id="searchError"></div><button id="doSearch" class="primary">Search</button><button id="closeSearch">Close</button><div id="searchResults"></div>`);$('closeSearch').onclick=closeModal;$('doSearch').onclick=async()=>{const b=$('doSearch');b.disabled=true;$('searchError').textContent='';$('searchResults').innerHTML='';try{const d=await api('/search',{method:'POST',body:JSON.stringify({query:$('searchQuery').value})});$('searchResults').innerHTML=(d.answer?`<p>${esc(d.answer)}</p>`:'')+d.results.map(x=>`<div class="result"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><p class="muted small">${esc(x.content)}</p></div>`).join('')}catch(e){$('searchError').textContent=e.message}finally{b.disabled=false}}};
$('adminBtn').onclick=async()=>{try{const d=await api('/admin/overview');modal(`<h2>Nobi admin</h2><div class="adminstats"><div class="stat"><strong>${d.counts.users}</strong><span class="muted small">Users</span></div><div class="stat"><strong>${d.counts.conversations}</strong><span class="muted small">Chats</span></div><div class="stat"><strong>${d.counts.messages}</strong><span class="muted small">Messages</span></div></div><h3>Accounts</h3><div id="adminUsers">${d.users.map(u=>`<div class="userrow"><div><strong>${esc(u.name)}</strong><div class="muted small">${esc(u.email)} · ${esc(u.role)}</div></div><div style="display:flex;gap:5px"><button data-role="${esc(u.id)}" data-newrole="${u.role==='admin'?'user':'admin'}">${u.role==='admin'?'Demote':'Make admin'}</button>${u.id===user.id?'':`<button data-delete="${esc(u.id)}">Delete</button>`}</div></div>`).join('')}</div><button id="closeAdmin">Close</button>`);$('closeAdmin').onclick=closeModal;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{try{await api('/admin/users/'+b.dataset.role+'/role',{method:'PATCH',body:JSON.stringify({role:b.dataset.newrole})});$('adminBtn').click()}catch(e){alert(e.message)}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this account and all its saved chats?'))try{await api('/admin/users/'+b.dataset.delete,{method:'DELETE'});$('adminBtn').click()}catch(e){alert(e.message)}})}catch(e){setStatus(e.message)}};
if('serviceWorker'in navigator && location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
loadMe();
</script>
</body></html>
